name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi

          case "${VERSION}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release version must look like v0.1.0"; exit 1 ;;
          esac

          VERSION_NAME="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH + 1))

          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "${ANDROID_KEY_ALIAS}" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "${ANDROID_KEY_PASSWORD}" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/hirmand-release.jks"
          chmod 600 "${RUNNER_TEMP}/hirmand-release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/hirmand-release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK and AAB
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "${APK}"
          apksigner verify --verbose "${APK}"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hirmand-phone-bridge-release-${{ steps.version.outputs.version_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hirmand Phone Bridge ${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
